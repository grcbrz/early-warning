[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "congo-ews"
version = "0.1.0"
description = "Congo Basin forest-resilience early-warning system"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: needs internet access to public data buckets",
  "acceptance: checks spec acceptance criteria against built artifacts",
]
addopts = "-m 'not network'"
